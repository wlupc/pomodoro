<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<style>
  :root {
    --pomodoro: #e74c3c;
    --short-break: #2ecc71;
    --long-break: #3498db;
    --bg: #1a1a2e;
    --card: #16213e;
    --text: #eee;
    --sub: #8892b0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  .container {
    background: var(--card);
    border-radius: 24px;
    padding: 48px 40px 36px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    min-width: 380px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 36px;
  }

  .tab {
    flex: 1;
    padding: 10px 8px;
    border: none;
    background: transparent;
    color: var(--sub);
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .tab.active {
    background: rgba(255,255,255,0.12);
    color: var(--text);
  }

  .timer-ring {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto 32px;
  }

  .timer-ring svg {
    transform: rotate(-90deg);
    width: 260px;
    height: 260px;
  }

  .ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 8;
  }

  .ring-progress {
    fill: none;
    stroke: var(--pomodoro);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s linear, stroke 0.3s;
  }

  .time-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }

  .status {
    font-size: 15px;
    color: var(--sub);
    margin-top: -20px;
    margin-bottom: 24px;
    height: 20px;
  }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn:active { transform: scale(0.96); }

  .btn-start {
    background: rgba(255,255,255,0.12);
    color: var(--text);
    min-width: 120px;
  }

  .btn-start:hover { background: rgba(255,255,255,0.2); }

  .btn-reset {
    background: rgba(255,255,255,0.04);
    color: var(--sub);
  }

  .btn-reset:hover { background: rgba(255,255,255,0.08); }

  .session-count {
    margin-top: 28px;
    font-size: 13px;
    color: var(--sub);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: background 0.2s;
  }

  .dot.done { background: var(--pomodoro); }
</style>
</head>
<body>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-mode="pomodoro">专注</button>
    <button class="tab" data-mode="short-break">小休</button>
    <button class="tab" data-mode="long-break">长休</button>
  </div>

  <div class="timer-ring">
    <svg viewBox="0 0 260 260">
      <circle class="ring-bg" cx="130" cy="130" r="124" />
      <circle class="ring-progress" id="ring" cx="130" cy="130" r="124"
              stroke-dasharray="779.1" stroke-dashoffset="0" />
    </svg>
    <div class="time-display" id="time">25:00</div>
  </div>

  <div class="status" id="status">准备开始</div>

  <div class="controls">
    <button class="btn btn-start" id="btnToggle">开始</button>
    <button class="btn btn-reset" id="btnReset">重置</button>
  </div>

  <div class="session-count">
    <span>今日完成</span>
    <span id="dots"></span>
    <span id="countLabel">0</span>
  </div>
</div>

<script>
  const MINUTES = {
    pomodoro: 25,
    'short-break': 5,
    'long-break': 15
  };

  const RING_CIRCUMFERENCE = 2 * Math.PI * 124; // ~779.1

  let mode = 'pomodoro';
  let totalSeconds = MINUTES[mode] * 60;
  let remaining = totalSeconds;
  let running = false;
  let intervalId = null;
  let sessionsToday = 0;

  // DOM
  const $time = document.getElementById('time');
  const $status = document.getElementById('status');
  const $ring = document.getElementById('ring');
  const $btnToggle = document.getElementById('btnToggle');
  const $btnReset = document.getElementById('btnReset');
  const $dots = document.getElementById('dots');
  const $countLabel = document.getElementById('countLabel');
  const $tabs = document.querySelectorAll('.tab');

  // Audio context for beep
  function beep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
  }

  function tripleBeep() {
    beep();
    setTimeout(beep, 600);
    setTimeout(beep, 1200);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  function updateDisplay() {
    $time.textContent = formatTime(remaining);
    const progress = remaining / totalSeconds;
    $ring.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - progress);
    document.title = `${formatTime(remaining)} - 番茄钟`;
  }

  function setModeColors() {
    const color = getComputedStyle(document.documentElement)
      .getPropertyValue(`--${mode === 'pomodoro' ? 'pomodoro' : mode === 'short-break' ? 'short-break' : 'long-break'}`).trim();
    $ring.style.stroke = color;
  }

  function switchMode(newMode) {
    mode = newMode;
    totalSeconds = MINUTES[mode] * 60;
    remaining = totalSeconds;
    running = false;
    clearInterval(intervalId);
    intervalId = null;
    $btnToggle.textContent = '开始';
    $status.textContent = '准备开始';

    $tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    setModeColors();
    updateDisplay();
  }

  function tick() {
    if (remaining <= 0) {
      finish();
      return;
    }
    remaining--;
    updateDisplay();
  }

  function finish() {
    running = false;
    clearInterval(intervalId);
    intervalId = null;
    tripleBeep();

    if (mode === 'pomodoro') {
      sessionsToday++;
      renderDots();
      $status.textContent = '完成！休息一下吧';
    } else {
      $status.textContent = '休息结束，继续加油！';
    }

    $btnToggle.textContent = '开始';
    remaining = 0;
    updateDisplay();
  }

  function toggle() {
    if (running) {
      running = false;
      clearInterval(intervalId);
      intervalId = null;
      $btnToggle.textContent = '继续';
      $status.textContent = '已暂停';
    } else {
      if (remaining <= 0) {
        remaining = totalSeconds;
        updateDisplay();
      }
      running = true;
      intervalId = setInterval(tick, 1000);
      $btnToggle.textContent = '暂停';
      $status.textContent = mode === 'pomodoro' ? '专注中...' : '休息中...';
    }
  }

  function reset() {
    running = false;
    clearInterval(intervalId);
    intervalId = null;
    remaining = totalSeconds;
    $btnToggle.textContent = '开始';
    $status.textContent = '准备开始';
    updateDisplay();
  }

  function renderDots() {
    $dots.innerHTML = Array.from({ length: sessionsToday }, () => '<span class="dot done"></span>').join('');
    $countLabel.textContent = sessionsToday;
  }

  // Init
  setModeColors();
  updateDisplay();
  renderDots();

  // Events
  $tabs.forEach(tab => {
    tab.addEventListener('click', () => switchMode(tab.dataset.mode));
  });

  $btnToggle.addEventListener('click', toggle);
  $btnReset.addEventListener('click', reset);

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      toggle();
    }
    if (e.code === 'KeyR' && !e.ctrlKey && !e.metaKey) {
      reset();
    }
  });
</script>

</body>
</html>
